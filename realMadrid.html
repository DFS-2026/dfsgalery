<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Madrid | DFS</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: white;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .marca {
      color: #ddd;
      letter-spacing: 5px;
      font-weight: bold;
      margin-bottom: 25px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
    }
    a {
      display: inline-block;
      margin-top: 25px;
      color: #ddd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="marca">DFS</div>
  <h1>REAL MADRID</h1>
  <div id="gallery" class="gallery"></div>
  <a href="index.html">← Volver al catálogo</a>  <script>
    const gallery = document.getElementById("gallery");

    const fotos = [
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791311107/Screenshot_2026-07-28-16-46-41-775_com.android.chrome.png",
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791311109/Screenshot_2026-08-10-16-59-05-704_com.android.chrome.png",
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791311113/Screenshot_2026-08-10-17-02-40-712_com.android.chrome.png"
    ];

    fotos.forEach(function(url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Camiseta Real Madrid";
      gallery.appendChild(img);
    });
  </script></body>
</html>
