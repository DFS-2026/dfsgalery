<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFS - Sevilla FC</title>

  <style>
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 45px;
      font-weight: 900;
      letter-spacing: 7px;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0 0;
    }

    .back {
      display: inline-block;
      margin: 20px;
      padding: 10px 16px;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }

    .gallery {
      max-width: 1000px;
      margin: auto;
      padding: 10px 15px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    @media (min-width: 700px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">DFS</div>
  <h1>Sevilla FC</h1>
</header>

<a class="back" href="index.html">← Volver</a>

<div id="gallery" class="gallery"></div>
 
<script>
const gallery = document.getElementById("gallery");

const fotos = [
  "https://res.cloudinary.com/pkegocbt/image/upload/v1791310699/IMG-20260723-WA0017.jpg"
];

fotos.forEach(function(url) {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "Camiseta Sevilla FC";
  img.style.width = "100%";
  gallery.appendChild(img);
});
</script>
</body>
</html>
