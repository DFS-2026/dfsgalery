<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Betis | DFS</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .marca {
      color: #20b65a;
      letter-spacing: 5px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .back {
      display: block;
      color: white;
      text-decoration: none;
      text-align: left;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
    }
    a {
      display: inline-block;
      margin-top: 25px;
      color: #20b65a;
      text-decoration: none;
    }
  </style>
</head>
<body>

  
  <div id="gallery" class="gallery"></div>
  
<a class="back" href="index.html">← Volver</a>

 <script>
    const gallery = document.getElementById("gallery");

    const fotos = [
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791310801/Screenshot_2026-08-04-19-24-40-533_com.openai.chatgpt.png",
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791310801/Screenshot_2026-08-04-19-18-45-496_com.openai.chatgpt.png",
      "https://res.cloudinary.com/pkegocbt/image/upload/v1791310801/Screenshot_2026-08-03-16-35-03-907_com.google.android.googlequicksearchbox.png"
    ];

    fotos.forEach(function(url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Camiseta Real Betis";
      gallery.appendChild(img);
    });
  </script></body>
</html>
